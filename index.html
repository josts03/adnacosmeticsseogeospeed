    <!-- Title, description, canonical in JSON-LD strani vstavi prerender (scripts/prerender.mjs)
         iz <SEO> komponente vsake strani; v razvoju jih nastavi Helmet na klientu. -->
    <!--app-head-->

    <!-- Preloader zavesa je v prerenderanem HTML-ju; vidna je samo ob prvem obisku v seji.
         Odločitev mora pasti pred prvim izrisom, zato je tu in ne v Reactu. -->
    <script>try{if(!sessionStorage.getItem('adna_visited'))document.documentElement.classList.add('first-visit')}catch(e){}</script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600;700&display=swap"
      />
    </noscript>
