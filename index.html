<!doctype html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="100x100" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Title, description, canonical in JSON-LD strani vstavi prerender (scripts/prerender.mjs)
         iz <SEO> komponente vsake strani; v razvoju jih nastavi Helmet na klientu. -->
    <!--app-head-->

    <!-- Preloader zavesa je v prerenderanem HTML-ju domače strani; vidna je samo ob prvem obisku
         v seji in samo na `/` (obiskovalec z Googla na podstrani vsebino vidi takoj). Odločitev
         mora pasti pred prvim izrisom, zato je tu in ne v Reactu. -->
    <script>try{if(location.pathname==='/'&&!sessionStorage.getItem('adna_visited'))document.documentElement.classList.add('first-visit')}catch(e){}</script>

    <!-- Pisave gostimo lokalno (public/fonts/, @font-face v src/index.css). Prednaložimo naslovno
         pisavo (oba podnabora, H1 je pogosto LCP) in osnovno besedilno; Inter latin-ext (85 KB)
         se naloži po potrebi, da ne tekmuje z LCP sliko. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/playfair-display-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/playfair-display-latin-ext.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin.woff2" crossorigin />

    <!-- Analitika: zaenkrat izklopljena (odločitev 15. 9. 2026) – merimo samo prek Search Console.
         Ko bo GA4 želen: measurement ID sem, nalaganje šele po privolitvi (cookie banner + politika
         zasebnosti trenutno izrecno pravita, da stran NE uporablja analitičnih piškotkov).
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
    </script>
    -->

    <!-- Site-wide entitete: WebSite, BeautySalon (#business), ustanoviteljica (#founder).
         Strani se nanje sklicujejo prek @id (src/lib/schema.ts). Telefon, naslov ulice in
         delovni čas dodaj sem, ko bodo papirji urejeni (glej src/data/site.ts). -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://www.adnacosmetics.si/#website",
          "url": "https://www.adnacosmetics.si",
          "name": "Adna Cosmetics",
          "inLanguage": "sl-SI",
          "publisher": { "@id": "https://www.adnacosmetics.si/#business" }
        },
        {
          "@type": "BeautySalon",
          "@id": "https://www.adnacosmetics.si/#business",
          "name": "Adna Cosmetics",
          "alternateName": "Adna Cosmetics Vrhnika",
          "description": "Kozmetični salon na Vrhniki, ki ga vodi kozmetičarka Adna Hadžalić. Manikura, pedikura, lash lift in laminacija obrvi, depilacija z voskom ter masaža. Delo poteka izključno po naročilu (po dogovoru).",
          "slogan": "Bodi vse, kar si",
          "url": "https://www.adnacosmetics.si",
          "image": "https://www.adnacosmetics.si/backgroundimage.webp",
          "logo": "https://www.adnacosmetics.si/logo.webp",
          "email": "adnaacosmetics@gmail.com",
          "priceRange": "€€",
          "currenciesAccepted": "EUR",
          "paymentAccepted": "Cash",
          "knowsLanguage": "sl",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Vrhnika",
            "postalCode": "1360",
            "addressRegion": "Osrednjeslovenska",
            "addressCountry": "SI"
          },
          "geo": {
            "@type": "GeoCoordinates",
            "latitude": 46.0569,
            "longitude": 14.2956
          },
          "areaServed": [
            { "@type": "City", "name": "Vrhnika" },
            { "@type": "City", "name": "Ljubljana" },
            { "@type": "City", "name": "Logatec" },
            { "@type": "City", "name": "Borovnica" },
            { "@type": "City", "name": "Brezovica" }
          ],
          "founder": { "@id": "https://www.adnacosmetics.si/#founder" },
          "employee": { "@id": "https://www.adnacosmetics.si/#founder" },
          "sameAs": ["https://www.instagram.com/adnaa_cosmetics"],
          "hasOfferCatalog": {
            "@type": "OfferCatalog",
            "@id": "https://www.adnacosmetics.si/#offers",
            "name": "Storitve salona Adna Cosmetics",
            "itemListElement": [
              {
                "@type": "Offer",
                "priceCurrency": "EUR",
                "priceSpecification": { "@type": "PriceSpecification", "minPrice": 25, "maxPrice": 45, "priceCurrency": "EUR" },
                "itemOffered": { "@type": "Service", "@id": "https://www.adnacosmetics.si/manikura-vrhnika#service", "url": "https://www.adnacosmetics.si/manikura-vrhnika", "name": "Manikura", "description": "Osnovna manikura, permanentno lakiranje ter podaljševanje nohtov (gel)." }
              },
              {
                "@type": "Offer",
                "priceCurrency": "EUR",
                "priceSpecification": { "@type": "PriceSpecification", "minPrice": 35, "maxPrice": 45, "priceCurrency": "EUR" },
                "itemOffered": { "@type": "Service", "@id": "https://www.adnacosmetics.si/pedikura-vrhnika#service", "url": "https://www.adnacosmetics.si/pedikura-vrhnika", "name": "Pedikura", "description": "Estetska pedikura, pedikura s trajnim lakiranjem in francosko poslikavo." }
              },
              {
                "@type": "Offer",
                "priceCurrency": "EUR",
                "priceSpecification": { "@type": "PriceSpecification", "minPrice": 35, "maxPrice": 70, "priceCurrency": "EUR" },
                "itemOffered": { "@type": "Service", "@id": "https://www.adnacosmetics.si/lash-lift-vrhnika#service", "url": "https://www.adnacosmetics.si/lash-lift-vrhnika", "name": "Lash lift in laminacija obrvi", "description": "Vihanje trepalnic (lash lift) in laminacija obrvi, po želji z barvanjem." }
              },
              {
                "@type": "Offer",
                "priceCurrency": "EUR",
                "priceSpecification": { "@type": "PriceSpecification", "minPrice": 10, "maxPrice": 30, "priceCurrency": "EUR" },
                "itemOffered": { "@type": "Service", "@id": "https://www.adnacosmetics.si/depilacija-vrhnika#service", "url": "https://www.adnacosmetics.si/depilacija-vrhnika", "name": "Depilacija z voskom", "description": "Depilacija z voskom za noge, roke, pazduhe in obraz." }
              },
              {
                "@type": "Offer",
                "priceCurrency": "EUR",
                "priceSpecification": { "@type": "PriceSpecification", "minPrice": 20, "maxPrice": 40, "priceCurrency": "EUR" },
                "itemOffered": { "@type": "Service", "@id": "https://www.adnacosmetics.si/masaza-vrhnika#service", "url": "https://www.adnacosmetics.si/masaza-vrhnika", "name": "Masaža", "description": "Klasična masaža telesa (60 min) in masaža zgornjega hrbta z vratom (30 min)." }
              }
            ]
          }
        },
        {
          "@type": "Person",
          "@id": "https://www.adnacosmetics.si/#founder",
          "name": "Adna Hadžalić",
          "givenName": "Adna",
          "familyName": "Hadžalić",
          "jobTitle": "Kozmetičarka",
          "description": "Ustanoviteljica in edina izvajalka v salonu Adna Cosmetics na Vrhniki: več kot 5 let izkušenj, več kot 20 strokovnih izobraževanj v Sloveniji in tujini, izobraževanje na Višji strokovni šoli za kozmetiko in velnes Ljubljana.",
          "url": "https://www.adnacosmetics.si/o-meni",
          "image": "https://www.adnacosmetics.si/profilna-slika.webp",
          "worksFor": { "@id": "https://www.adnacosmetics.si/#business" },
          "alumniOf": { "@type": "EducationalOrganization", "name": "Višja strokovna šola za kozmetiko in velnes Ljubljana" },
          "knowsAbout": ["Manikura", "Podaljševanje nohtov z gelom", "Permanentno lakiranje", "Pedikura", "Lash lift", "Laminacija obrvi", "Depilacija z voskom", "Klasična masaža"],
          "knowsLanguage": "sl",
          "sameAs": ["https://www.instagram.com/adnaa_cosmetics"]
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
